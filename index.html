<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b8d4dd" />
    <meta name="description" content="A little railway world. An animated, generative low-poly landscape." />
    <title>Little Railway World</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <main aria-label="An animated miniature railway landscape">
      <canvas id="world" tabindex="0" role="img" aria-label="A sunlit isometric railway linking miniature towns across farmland, forests, plains, desert, coastal water, and snow-capped mountains. Zoom out for a flat map, or zoom in for an overhead view. Drag to orbit the main world or pan the map and close view. Click a train to follow it. F follows a nearby train; left and right brackets cycle trains. Escape or zooming out releases the train. Plus and minus zoom, arrow keys orbit or pan, Home resets the view, Space pauses, and R generates another world."></canvas>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
