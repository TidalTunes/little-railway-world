<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b8d4dd" />
    <meta name="description" content="A little railway world. An animated, generative low-poly landscape." />
    <title>Little Railway World</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <main aria-label="An animated miniature railway landscape">
